api:
  version: v1
  prefix: /v1
  host: 127.0.0.1
  port: 8000
  allowed_origins:
    - http://localhost:8501
    - http://127.0.0.1:8501

model:
  path: models/model.onnx
  card: models/model_card.json
  classes_source: configs/data.yaml
  format: onnx
  input_size: 224

inference:
  top_k_default: 3
  top_k_min: 1
  top_k_max: 9
  batch_limit: 16
  max_upload_mb: 5
  allowed_extensions:
    - .jpg
    - .jpeg
    - .png

logging:
  requests: true
  store_images: false

demo:
  camera_index: 0
  target_fps: 8
  top_k: 3
  smoothing_window: 5
  show_top_k: true
  request_timeout_s: 2.0
